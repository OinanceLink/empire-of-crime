<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>EMPIRE OF CRIME — V3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
}

#game {
    display: block;
    width: 100vw;
    height: 100dvh;
    background: #49734c;
}

/* TOP HUD */

#hud {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 5;
    pointer-events: none;
}

.logo {
    font-size: 18px;
    font-weight: 900;
    color: #ff3030;
    letter-spacing: 2px;
    text-shadow: 2px 2px #000;
}

.panel {
    background: rgba(0,0,0,.8);
    padding: 10px;
    margin-top: 8px;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.8;
    min-width: 140px;
}

.value {
    color: #ffe34a;
    font-weight: bold;
}

#speed {
    font-size: 24px;
    color: #56ff8b;
    font-weight: 900;
}

#message {
    position: fixed;
    top: 23%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.85);
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
    z-index: 10;
    display: none;
    white-space: nowrap;
}

/* BUTTONS */

button {
    color: white;
    background: rgba(15,15,15,.88);
    border: 1px solid #666;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    touch-action: none;
}

button:active {
    background: #a52323;
    transform: scale(.96);
}

#controls {
    position: fixed;
    inset: auto 0 15px 0;
    height: 165px;
    z-index: 6;
    pointer-events: none;
}

#movement {
    position: absolute;
    bottom: 0;
    left: 15px;
    display: grid;
    grid-template-columns: 52px 52px 52px;
    grid-template-rows: 52px 52px;
    gap: 5px;
    pointer-events: auto;
}

#movement button {
    font-size: 22px;
}

#up {
    grid-column: 2;
    grid-row: 1;
}

#left {
    grid-column: 1;
    grid-row: 2;
}

#down {
    grid-column: 2;
    grid-row: 2;
}

#right {
    grid-column: 3;
    grid-row: 2;
}

#actions {
    position: absolute;
    right: 12px;
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: auto;
}

#actions button {
    padding: 13px 15px;
    min-width: 105px;
    font-size: 11px;
}

#driveControls {
    position: fixed;
    right: 12px;
    bottom: 205px;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 7;
}

#driveControls button {
    padding: 13px;
    min-width: 90px;
}

#garage {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.92);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.garage-box {
    background: #191919;
    border: 1px solid #555;
    padding: 22px;
    border-radius: 15px;
    width: 100%;
    max-width: 360px;
    max-height: 85vh;
    overflow-y: auto;
}

.garage-box h2 {
    color: #ff3a3a;
    margin-bottom: 10px;
}

.car-option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #292929;
    margin-top: 10px;
    padding: 12px;
    border-radius: 8px;
    gap: 8px;
}

.car-option button {
    padding: 10px;
    background: #9b2020;
}

#closeGarage {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
}

#help {
    position: fixed;
    bottom: 190px;
    left: 12px;
    font-size: 10px;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 8px;
    border-radius: 6px;
    pointer-events: none;
}

@media (max-height: 500px) {
    #controls {
        bottom: 5px;
    }

    #movement {
        grid-template-columns: 43px 43px 43px;
        grid-template-rows: 43px 43px;
    }

    #actions button {
        padding: 8px;
    }

    #driveControls {
        bottom: 165px;
    }

    #help {
        display: none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="logo">EMPIRE OF CRIME</div>
    <div style="font-size:10px;color:#aaa;margin-top:3px">
        OPEN WORLD V3
    </div>

    <div class="panel">
        CASH: <span class="value" id="cash">$2,500</span><br>
        MODE: <span class="value" id="mode">WALKING</span><br>
        VEHICLE: <span class="value" id="vehicleName">ON FOOT</span><br>
        SPEED: <span id="speed">0</span> km/h<br>
        FUEL: <span class="value" id="fuel">100%</span>
        <div style="background:#444;height:5px;margin-top:3px">
            <div id="fuelBar"
            style="width:100%;height:100%;background:#51ef78"></div>
        </div>
        POLICE: <span id="wanted">☆☆☆☆☆</span>
    </div>

</div>

<div id="message"></div>

<div id="help">
    MOVE: Arrows / WASD<br>
    DRIVE: Hold accelerator<br>
    GARAGE: Visit the blue building
</div>

<div id="controls">

    <div id="movement">
        <button id="up" data-key="up">▲</button>
        <button id="left" data-key="left">◀</button>
        <button id="down" data-key="down">▼</button>
        <button id="right" data-key="right">▶</button>
    </div>

    <div id="actions">
        <button id="enterBtn">🚗 ENTER CAR</button>
        <button id="exitBtn" style="display:none">🚶 EXIT CAR</button>
        <button id="garageBtn">🏠 GARAGE</button>
    </div>

</div>

<div id="driveControls">
    <button id="accelerate">ACCELERATE ▲</button>
    <button id="brake">BRAKE ▼</button>
    <button id="handbrake">HANDBRAKE</button>
</div>

<div id="garage">
    <div class="garage-box">
        <h2>🏠 CITY GARAGE</h2>
        <p style="font-size:12px;color:#aaa">
            Select a vehicle to spawn it beside you.
        </p>

        <div id="carList"></div>

        <button id="closeGarage">CLOSE GARAGE</button>
    </div>
</div>

<script>
"use strict";

/* =================================
   EMPIRE OF CRIME — VERSION 3
================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize() {
    W = innerWidth;
    H = innerHeight;

    canvas.width = Math.floor(W * devicePixelRatio);
    canvas.height = Math.floor(H * devicePixelRatio);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        devicePixelRatio, 0,
        0, devicePixelRatio, 0, 0
    );
}

addEventListener("resize", resize);
resize();

/* WORLD */

const TILE = 300;
const ROAD = 100;
const BLOCK = TILE - ROAD;

const world = {
    width: 6000,
    height: 6000
};

const player = {
    x: 300,
    y: 250,
    angle: 0,
    speed: 0,
    fuel: 100,
    money: 2500,
    inCar: false,
    car: null,
    wanted: 0,
    walkSpeed: 2.7
};

/* VEHICLES */

const carTypes = [
    {
        name: "City Sedan",
        color: "#e53d3d",
        maxSpeed: 170,
        acceleration: 0.13,
        price: 0,
        fuel: 100
    },
    {
        name: "Sports Car",
        color: "#ffcc22",
        maxSpeed: 250,
        acceleration: 0.22,
        price: 800,
        fuel: 100
    },
    {
        name: "Police Cruiser",
        color: "#eeeeee",
        maxSpeed: 210,
        acceleration: 0.17,
        price: 1500,
        fuel: 100
    },
    {
        name: "Super SUV",
        color: "#3589ff",
        maxSpeed: 190,
        acceleration: 0.15,
        price: 1200,
        fuel: 100
    }
];

let cars = [];

function createCar(typeIndex, x, y, angle = 0) {
    const type = carTypes[typeIndex];

    return {
        x,
        y,
        angle,
        speed: 0,
        typeIndex,
        color: type.color,
        maxSpeed: type.maxSpeed,
        acceleration: type.acceleration,
        fuel: 100,
        occupied: false
    };
}

/* CITY */

const buildings = [];

function buildCity() {
    buildings.length = 0;

    for (let x = 0; x < world.width; x += TILE) {
        for (let y = 0; y < world.height; y += TILE) {

            buildings.push({
                x: x + ROAD,
                y: y + ROAD,
                w: BLOCK,
                h: BLOCK,
                color: ["#777c80","#8d8175","#727a71"][
                    Math.floor(Math.random() * 3)
                ]
            });
        }
    }
}

buildCity();

/* GARAGE LOCATION */

const garage = {
    x: 150,
    y: 150
};

/* RANDOM CARS */

function spawnWorldCars() {
    cars = [];

    for (let i = 0; i < 15; i++) {
        const x = 150 + Math.random() * 5600;
        const y = 150 + Math.random() * 5600;

        // Keep parked vehicles near streets.
        const useVerticalRoad = Math.random() > 0.5;

        const roadX = Math.round(x / TILE) * TILE + ROAD / 2;
        const roadY = Math.round(y / TILE) * TILE + ROAD / 2;

        cars.push(
            createCar(
                Math.floor(Math.random() * carTypes.length),
                useVerticalRoad ? roadX : x,
                useVerticalRoad ? y : roadY,
                useVerticalRoad ? Math.PI / 2 : 0
            )
        );
    }
}

spawnWorldCars();

/* INPUT */

const keys = {};

function setKey(key, value) {
    keys[key] = value;
}

document.querySelectorAll("[data-key]").forEach(button => {

    const key = button.dataset.key;

    button.addEventListener("pointerdown", event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        setKey(key, true);
    });

    button.addEventListener("pointerup", () => setKey(key, false));
    button.addEventListener("pointercancel", () => setKey(key, false));
    button.addEventListener("lostpointercapture", () => setKey(key, false));
});

document.addEventListener("keydown", event => {

    const k = event.key.toLowerCase();

    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) {
        event.preventDefault();
    }

    if (k === "arrowup" || k === "w") keys.up = true;
    if (k === "arrowdown" || k === "s") keys.down = true;
    if (k === "arrowleft" || k === "a") keys.left = true;
    if (k === "arrowright" || k === "d") keys.right = true;

    if (k === "e" && !event.repeat) toggleCar();
    if (k === "g" && !event.repeat) openGarage();
});

document.addEventListener("keyup", event => {

    const k = event.key.toLowerCase();

    if (k === "arrowup" || k === "w") keys.up = false;
    if (k === "arrowdown" || k === "s") keys.down = false;
    if (k === "arrowleft" || k === "a") keys.left = false;
    if (k === "arrowright" || k === "d") keys.right = false;
});

function holdButton(id, key) {
    const button = document.getElementById(id);

    button.addEventListener("pointerdown", event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        keys[key] = true;
    });

    button.addEventListener("pointerup", () => keys[key] = false);
    button.addEventListener("pointercancel", () => keys[key] = false);
    button.addEventListener("lostpointercapture", () => keys[key] = false);
}

holdButton("accelerate", "accelerate");
holdButton("brake", "brake");
holdButton("handbrake", "handbrake");

/* MESSAGE */

let messageTimer;

function showMessage(text) {
    const box = document.getElementById("message");

    box.textContent = text;
    box.style.display = "block";

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {
        box.style.display = "none";
    }, 2200);
}

/* COLLISIONS */

function isBlocked(x, y, radius = 12) {

    if (
        x < radius ||
        y < radius ||
        x > world.width - radius ||
        y > world.height - radius
    ) {
        return true;
    }

    for (const b of buildings) {

        if (
            x + radius > b.x &&
            x - radius < b.x + b.w &&
            y + radius > b.y &&
            y - radius < b.y + b.h
        ) {
            return true;
        }
    }

    return false;
}

/* ENTER AND EXIT VEHICLES */

function findNearestCar() {

    let nearest = null;
    let nearestDistance = 65;

    for (const car of cars) {

        if (car.occupied) continue;

        const d = Math.hypot(
            car.x - player.x,
            car.y - player.y
        );

        if (d < nearestDistance) {
            nearest = car;
            nearestDistance = d;
        }
    }

    return nearest;
}

function toggleCar() {

    if (player.inCar) {

        const car = player.car;

        if (Math.abs(car.speed) > 8) {
            showMessage("Slow down before exiting!");
            return;
        }

        const exitX = car.x + Math.cos(car.angle + Math.PI / 2) * 35;
        const exitY = car.y + Math.sin(car.angle + Math.PI / 2) * 35;

        if (isBlocked(exitX, exitY, 10)) {
            showMessage("Cannot exit here!");
            return;
        }

        player.x = exitX;
        player.y = exitY;

        car.occupied = false;

        player.inCar = false;
        player.car = null;

        document.getElementById("enterBtn").style.display = "block";
        document.getElementById("exitBtn").style.display = "none";
        document.getElementById("driveControls").style.display = "none";

        showMessage("You exited the vehicle.");

    } else {

        const car = findNearestCar();

        if (!car) {
            showMessage("No car nearby. Find a vehicle!");
            return;
        }

        player.car = car;
        player.inCar = true;
        car.occupied = true;

        document.getElementById("enterBtn").style.display = "none";
        document.getElementById("exitBtn").style.display = "block";
        document.getElementById("driveControls").style.display = "flex";

        showMessage("You entered the " + carTypes[car.typeIndex].name);
    }
}

document.getElementById("enterBtn").onclick = toggleCar;
document.getElementById("exitBtn").onclick = toggleCar;

/* GARAGE */

function openGarage() {

    const distance = Math.hypot(
        player.x - garage.x,
        player.y - garage.y
    );

    if (distance > 180) {
        showMessage("Visit the blue GARAGE building first!");
        return;
    }

    if (player.inCar && Math.abs(player.car.speed) > 8) {
        showMessage("Stop your car before opening the garage.");
        return;
    }

    if (player.inCar) {
        player.car.occupied = false;
        player.inCar = false;
        player.car = null;

        document.getElementById("enterBtn").style.display = "block";
        document.getElementById("exitBtn").style.display = "none";
        document.getElementById("driveControls").style.display = "none";
    }

    document.getElementById("garage").style.display = "flex";
    renderGarage();
}

document.getElementById("garageBtn").onclick = openGarage;

document.getElementById("closeGarage").onclick = () => {
    document.getElementById("garage").style.display = "none";
};

function renderGarage() {

    const list = document.getElementById("carList");

    list.innerHTML = "";

    carTypes.forEach((type, index) => {

        const row = document.createElement("div");
        row.className = "car-option";

        const description = document.createElement("div");

        description.innerHTML =
            `<strong>${type.name}</strong><br>
             <small>Max speed: ${type.maxSpeed} km/h</small><br>
             <small>Price: ${type.price === 0 ? "FREE" : "$" + type.price}</small>`;

        const button = document.createElement("button");
        button.textContent = type.price === 0 ? "SELECT" : "BUY / SELECT";

        button.onclick = () => {

            const owned = ownedCars.has(index);

            if (!owned) {

                if (player.money < type.price) {
                    showMessage("Not enough cash!");
                    return;
                }

                player.money -= type.price;
                ownedCars.add(index);

                showMessage("Vehicle purchased!");
            }

            if (player.inCar && player.car) {
                player.car.occupied = false;
            }

            player.inCar = false;
            player.car = null;

            const spawnedCar = createCar(
                index,
                player.x + 35,
                player.y,
                0
            );

            cars.push(spawnedCar);

            player.car = spawnedCar;
            player.inCar = true;
            spawnedCar.occupied = true;

            document.getElementById("enterBtn").style.display = "none";
            document.getElementById("exitBtn").style.display = "block";
            document.getElementById("driveControls").style.display = "flex";

            document.getElementById("garage").style.display = "none";

            showMessage(type.name + " ready to drive!");
        };

        row.appendChild(description);
        row.appendChild(button);

        list.appendChild(row);
    });
}

const ownedCars = new Set([0]);

/* GAME UPDATE */

function updatePlayer() {

    if (player.inCar) {

        const car = player.car;

        if (!car) return;

        if (keys.accelerate || keys.up) {
            if (car.fuel > 0) {
                car.speed += car.acceleration;
            }
        }

        if (keys.brake || keys.down) {
            car.speed -= car.acceleration * 1.8;
        }

        car.speed = Math.max(
            -car.maxSpeed * 0.3 / 4,
            Math.min(car.maxSpeed / 4, car.speed)
        );

        if (keys.handbrake) {
            car.speed *= 0.90;
        }

        if (keys.left) {
            car.angle -= 0.045 * (car.speed >= 0 ? 1 : -1);
        }

        if (keys.right) {
            car.angle += 0.045 * (car.speed >= 0 ? 1 : -1);
        }

        if (!keys.accelerate && !keys.up &&
            !keys.brake && !keys.down) {
            car.speed *= 0.985;
        }

        const nx = car.x + Math.cos(car.angle) * car.speed;
        const ny = car.y + Math.sin(car.angle) * car.speed;

        if (!isBlocked(nx, ny, 14)) {

            car.x = nx;
            car.y = ny;

        } else {

            car.speed *= -0.25;
            showMessage("Collision!");
        }

        if (Math.abs(car.speed) > 0.1 && car.fuel > 0) {
            car.fuel -= Math.abs(car.speed) * 0.0009;
            car.fuel = Math.max(0, car.fuel);
        }

        if (car.fuel <= 0) {
            car.speed *= 0.96;
        }

        player.x = car.x;
        player.y = car.y;

    } else {

        let dx = 0;
        let dy = 0;

        if (keys.up) dy -= 1;
        if (keys.down) dy += 1;
        if (keys.left) dx -= 1;
        if (keys.right) dx += 1;

        if (dx || dy) {

            const length = Math.hypot(dx, dy);

            dx = dx / length * player.walkSpeed;
            dy = dy / length * player.walkSpeed;

            if (!isBlocked(player.x + dx, player.y, 9)) {
                player.x += dx;
            }

            if (!isBlocked(player.x, player.y + dy, 9)) {
                player.y += dy;
            }
        }
    }
}

/* DRAW WORLD */

function drawRoads(cameraX, cameraY) {

    ctx.fillStyle = "#4a754d";
    ctx.fillRect(0, 0, W, H);

    // Road grid.
    ctx.fillStyle = "#383b40";

    for (let x = 0; x < world.width; x += TILE) {
        ctx.fillRect(
            x - cameraX,
            -cameraY,
            ROAD,
            world.height
        );
    }

    for (let y = 0; y < world.height; y += TILE) {
        ctx.fillRect(
            -cameraX,
            y - cameraY,
            world.width,
            ROAD
        );
    }

    // Lane markings.
    ctx.strokeStyle = "#c7c3a1";
    ctx.lineWidth = 2;
    ctx.setLineDash([18, 18]);

    for (let x = 0; x < world.width; x += TILE) {

        ctx.beginPath();

        ctx.moveTo(
            x + ROAD / 2 - cameraX,
            -cameraY
        );

        ctx.lineTo(
            x + ROAD / 2 - cameraX,
            world.height - cameraY
        );

        ctx.stroke();
    }

    for (let y = 0; y < world.height; y += TILE) {

        ctx.beginPath();

        ctx.moveTo(
            -cameraX,
            y + ROAD / 2 - cameraY
        );

        ctx.lineTo(
            world.width - cameraX,
            y + ROAD / 2 - cameraY
        );

        ctx.stroke();
    }

    ctx.setLineDash([]);

    // Buildings.
    for (const b of buildings) {

        if (
            b.x - cameraX > W ||
            b.y - cameraY > H ||
            b.x + b.w - cameraX < 0 ||
            b.y + b.h - cameraY < 0
        ) continue;

        ctx.fillStyle = "#262a2d";

        ctx.fillRect(
            b.x - cameraX + 7,
            b.y - cameraY + 8,
            b.w,
            b.h
        );

        ctx.fillStyle = b.color;

        ctx.fillRect(
            b.x - cameraX,
            b.y - cameraY,
            b.w,
            b.h
        );

        ctx.fillStyle = "rgba(255,255,255,.08)";

        ctx.fillRect(
            b.x - cameraX + 12,
            b.y - cameraY + 12,
            b.w - 24,
            9
        );

        // Windows.
        ctx.fillStyle = "#b8c7c9";

        for (let wx = 0; wx < 4; wx++) {
            for (let wy = 0; wy < 4; wy++) {

                ctx.fillRect(
                    b.x - cameraX + 20 + wx * 48,
                    b.y - cameraY + 25 + wy * 48,
                    15,
                    18
                );
            }
        }
    }

    // Garage.
    ctx.fillStyle = "#1246b4";

    ctx.fillRect(
        garage.x - cameraX - 35,
        garage.y - cameraY - 35,
        70,
        70
    );

    ctx.fillStyle = "white";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "GARAGE",
        garage.x - cameraX,
        garage.y - cameraY + 5
    );
}

/* DRAW CARS */

function drawCar(car, cameraX, cameraY) {

    const x = car.x - cameraX;
    const y = car.y - cameraY;

    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(car.angle);

    // Wheels.
    ctx.fillStyle = "#111";

    ctx.fillRect(-13, -15, 10, 7);
    ctx.fillRect(4, -15, 10, 7);
    ctx.fillRect(-13, 8, 10, 7);
    ctx.fillRect(4, 8, 10, 7);

    // Body.
    ctx.fillStyle = car.color;
    ctx.fillRect(-20, -11, 40, 22);

    // Windows.
    ctx.fillStyle = "#172d3b";
    ctx.fillRect(-8, -8, 15, 16);

    // Headlights.
    ctx.fillStyle = "#fff5ae";
    ctx.fillRect(17, -9, 3, 5);
    ctx.fillRect(17, 4, 3, 5);

    // Occupied indicator.
    if (car.occupied) {
        ctx.strokeStyle = "#58ff80";
        ctx.lineWidth = 2;
        ctx.strokeRect(-22, -13, 44, 26);
    }

    ctx.restore();
}

/* DRAW PLAYER */

function drawPlayer(cameraX, cameraY) {

    if (player.inCar) return;

    const x = player.x - cameraX;
    const y = player.y - cameraY;

    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.ellipse(x, y + 7, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#222";

    ctx.beginPath();
    ctx.arc(x, y, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffcc8a";

    ctx.beginPath();
    ctx.arc(x, y - 3, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#39a3ff";

    ctx.fillRect(x - 6, y + 2, 12, 9);
}

/* HUD */

function updateHUD() {

    document.getElementById("cash").textContent =
        "$" + player.money.toLocaleString();

    document.getElementById("mode").textContent =
        player.inCar ? "DRIVING" : "WALKING";

    document.getElementById("vehicleName").textContent =
        player.inCar
        ? carTypes[player.car.typeIndex].name
        : "ON FOOT";

    const speed = player.inCar
        ? Math.round(Math.abs(player.car.speed) * 4)
        : 0;

    document.getElementById("speed").textContent = speed;

    const fuel = player.inCar
        ? Math.round(player.car.fuel)
        : 100;

    document.getElementById("fuel").textContent = fuel + "%";

    document.getElementById("fuelBar").style.width = fuel + "%";

    document.getElementById("fuelBar").style.background =
        fuel < 20 ? "#ff3333" : "#51ef78";

    document.getElementById("wanted").textContent =
        "★".repeat(player.wanted) +
        "☆".repeat(5 - player.wanted);
}

/* MAIN LOOP */

function gameLoop() {

    updatePlayer();

    const focusX = player.x;
    const focusY = player.y;

    const cameraX = Math.max(
        0,
        Math.min(world.width - W, focusX - W / 2)
    );

    const cameraY = Math.max(
        0,
        Math.min(world.height - H, focusY - H / 2)
    );

    drawRoads(cameraX, cameraY);

    for (const car of cars) {
        drawCar(car, cameraX, cameraY);
    }

    drawPlayer(cameraX, cameraY);

    updateHUD();

    requestAnimationFrame(gameLoop);
}

/* START */

renderGarage();
gameLoop();

showMessage("Welcome to Empire of Crime V3!");
</script>
