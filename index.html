<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Empire of Crime</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="game"></canvas>

  <header id="hud">
    <div class="brand">EMPIRE <span>OF CRIME</span></div>
    <div class="subtitle">OPEN WORLD • CITY LIFE</div>

    <div class="stats">
      <div>💵 CASH <b id="cash">$1,000</b></div>
      <div>📍 <b id="district">DOWNTOWN</b></div>
    </div>

    <div class="stats">
      <div>🚘 <b id="carName">ON FOOT</b></div>
      <div>⚡ <b id="speed">0</b> km/h</div>
    </div>

    <div class="fuel-container">
      FUEL
      <div class="fuel-track">
        <div id="fuelBar"></div>
      </div>
      <b id="fuelText">100%</b>
    </div>

    <div id="wanted">POLICE: ☆☆☆☆☆</div>
    <div id="mission">MISSION: Explore the city</div>
  </header>

  <div id="notification">Welcome to the city!</div>

  <div id="controls">
    <button id="up" aria-label="Move forward">▲</button>
    <button id="left" aria-label="Move left">◀</button>
    <button id="down" aria-label="Move backward">▼</button>
    <button id="right" aria-label="Move right">▶</button>
  </div>

  <div id="actions">
    <button id="interact">INTERACT</button>
    <button id="enterBtn">ENTER CAR</button>
    <button id="garageBtn">GARAGE</button>
    <button id="mapBtn">CITY MAP</button>
  </div>

  <div id="panel">
    <div class="panel-box">
      <button id="closePanel" class="close">✕</button>
      <h2 id="panelTitle">CITY</h2>
      <p id="panelText"></p>
      <div id="panelButtons"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
