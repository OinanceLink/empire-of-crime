<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Empire of Crime - Version 3</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #080b10;
  color: white;
  font-family: Arial, sans-serif;
  touch-action: none;
  user-select: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100dvh;
  background: #20262c;
}

#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  padding: 10px;
  background: #080b10eF;
  border: 1px solid #3b4654;
  border-radius: 12px;
  pointer-events: none;
}

#hud h2 {
  margin: 0 0 7px;
  color: #f5a623;
  font-size: 18px;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  font-size: 12px;
  margin-top: 5px;
}

#fuelOuter {
  width: 110px;
  height: 8px;
  background: #454545;
  border-radius: 8px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
}

#fuelBar {
  width: 100%;
  height: 100%;
  background: #55d879;
}

#mission {
  font-size: 12px;
  color: #e1e5ea;
  margin-top: 6px;
}

#controls {
  position: absolute;
  left: 12px;
  bottom: 18px;
  display: grid;
  grid-template-columns: 49px 49px 49px;
  grid-template-rows: 49px 49px;
  gap: 5px;
}

button {
  border: 1px solid #657386;
  border-radius: 12px;
  background: #202833ed;
  color: white;
  font-size: 21px;
  font-weight: bold;
  touch-action: none;
}

button:active {
  background: #f5a623;
  color: #111;
}

#up {
  grid-column: 2;
  grid-row: 1;
}

#left {
  grid-column: 1;
  grid-row: 2;
}

#down {
  grid-column: 2;
  grid-row: 2;
}

#right {
  grid-column: 3;
  grid-row: 2;
}

#driveControls {
  position: absolute;
  right: 12px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.driveButton {
  width: 82px;
  height: 48px;
  font-size: 12px;
  background: #303b49ed;
}

#enterBtn {
  background: #176b43ed;
}

#garageBtn {
  background: #a66a15ed;
}

#message {
  display: none;
  position: absolute;
  z-index: 10;
  left: 8%;
  right: 8%;
  top: 35%;
  padding: 18px;
  text-align: center;
  border: 1px solid #f5a623;
  border-radius: 15px;
  background: #080b10f5;
}

#message h2 {
  color: #f5a623;
  margin-top: 0;
}

#message p {
  font-size: 14px;
  line-height: 1.5;
}

#continueBtn {
  padding: 12px 22px;
  background: #f5a623;
  color: #111;
  font-size: 14px;
}

@media (max-width: 370px) {
  #controls {
    left: 7px;
    grid-template-columns: 43px 43px 43px;
    grid-template-rows: 43px 43px;
  }

  .driveButton {
    width: 70px;
    height: 44px;
  }

  #hud h2 {
    font-size: 16px;
  }

  .stats {
    gap: 5px 9px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <h2>EMPIRE OF CRIME</h2>

  <div id="mission">MISSION 1: Explore the city</div>

  <div class="stats">
    <span>MODE: <b id="mode">ON FOOT</b></span>
    <span>SPEED: <b id="speed">0</b> km/h</span>
  </div>

  <div class="stats">
    <span>CAR: <b id="carName">NONE</b></span>
    <span>FUEL: <span id="fuelOuter"><span id="fuelBar"></span></span>
      <b id="fuelText">100%</b>
    </span>
  </div>

  <div class="stats">
    <span>LOCATION: <b id="location">UNITED STATES</b></span>
    <span>CASH: <b id="cash">$1,000</b></span>
  </div>
</div>

<div id="controls">
  <button id="up" aria-label="Move forward">▲</button>
  <button id="left" aria-label="Turn left">◀</button>
  <button id="down" aria-label="Move backward">▼</button>
  <button id="right" aria-label="Turn right">▶</button>
</div>

<div id="driveControls">
  <button class="driveButton" id="enterBtn">ENTER CAR</button>
  <button class="driveButton" id="garageBtn">GARAGE</button>
  <button class="driveButton" id="missionBtn">MISSION</button>
</div>

<div id="message">
  <h2 id="messageTitle">GARAGE</h2>
  <p id="messageText"></p>
  <div id="messageButtons"></div>
</div>

<script>
"use strict";

// ====================================
// EMPIRE OF CRIME - VERSION 3
// ====================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

let W = window.innerWidth;
let H = window.innerHeight;

const WORLD_W = 1800;
const WORLD_H = 1800;

const ROAD_SPACING = 240;
const ROAD_WIDTH = 65;

let cameraX = 0;
let cameraY = 0;

let cash = 1000;
let gamePaused = false;
let missionComplete = false;
let policeActive = false;
let gameOver = false;

const keys = {};

const player = {
  x: 280,
  y: 280,
  size: 20,
  speed: 2.7,
  angle: 0,
  inCar: null
};

const cars = [
  {
    name: "Street Runner",
    x: 350,
    y: 280,
    angle: 0,
    color: "#e34c4c",
    speed: 0,
    maxSpeed: 4.5,
    acceleration: 0.08,
    fuel: 100,
    fuelMax: 100,
    owned: true,
    parked: true
  },
  {
    name: "Night Rider",
    x: 520,
    y: 280,
    angle: Math.PI / 2,
    color: "#347bd1",
    speed: 0,
    maxSpeed: 5.4,
    acceleration: 0.10,
    fuel: 100,
    fuelMax: 100,
    owned: true,
    parked: true
  },
  {
    name: "Golden Beast",
    x: 760,
    y: 280,
    angle: 0,
    color: "#f5a623",
    speed: 0,
    maxSpeed: 6.2,
    acceleration: 0.12,
    fuel: 100,
    fuelMax: 100,
    owned: false,
    price: 500,
    parked: true
  },
  {
    name: "Shadow GT",
    x: 990,
    y: 280,
    angle: Math.PI / 2,
    color: "#a6aab2",
    speed: 0,
    maxSpeed: 7,
    acceleration: 0.14,
    fuel: 100,
    fuelMax: 100,
    owned: false,
    price: 800,
    parked: true
  }
];

const police = {
  x: 750,
  y: 750,
  angle: 0,
  active: false,
  speed: 1.5
};

const buildings = [];

const goal = {
  x: 1100,
  y: 300,
  size: 25
};

const garage = {
  x: 300,
  y: 500,
  w: 100,
  h: 80
};

// ====================================
// SCREEN SETUP
// ====================================

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

// ====================================
// CITY GENERATION
// ====================================

for (let x = 80; x < WORLD_W; x += ROAD_SPACING) {
  for (let y = 80; y < WORLD_H; y += ROAD_SPACING) {
    buildings.push({
      x: x + 35,
      y: y + 35,
      w: 125,
      h: 125,
      color: Math.random() > 0.5 ? "#303741" : "#262e38"
    });
  }
}

function collidesBuilding(x, y, size) {
  return buildings.some(b =>
    x + size / 2 > b.x &&
    x - size / 2 < b.x + b.w &&
    y + size / 2 > b.y &&
    y - size / 2 < b.y + b.h
  );
}

function isInsideGarage(x, y) {
  return (
    x > garage.x &&
    x < garage.x + garage.w &&
    y > garage.y &&
    y < garage.y + garage.h
  );
}

// ====================================
// CONTROLS
// ====================================

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();

  if ([
    "arrowup", "arrowdown", "arrowleft", "arrowright", " "
  ].includes(key)) {
    e.preventDefault();
  }

  keys[key] = true;

  if (key === "e") enterOrExitCar();
  if (key === "g") openGarage();
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function bindButton(id, key) {
  const button = $(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
    button.setPointerCapture(e.pointerId);
  });

  function release(e) {
    e.preventDefault();
    keys[key] = false;
  }

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);

  button.addEventListener("lostpointercapture", () => {
    keys[key] = false;
  });
}

bindButton("up", "arrowup");
bindButton("down", "arrowdown");
bindButton("left", "arrowleft");
bindButton("right", "arrowright");

// ====================================
// DRAW ROADS
// ====================================

function drawRoads() {
  ctx.fillStyle = "#20262c";
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  for (let x = 0; x < WORLD_W; x += ROAD_SPACING) {
    ctx.fillStyle = "#383e43";
    ctx.fillRect(x, 0, ROAD_WIDTH, WORLD_H);

    ctx.strokeStyle = "#b0b0b055";
    ctx.setLineDash([16, 18]);
    ctx.beginPath();
    ctx.moveTo(x + ROAD_WIDTH / 2, 0);
    ctx.lineTo(x + ROAD_WIDTH / 2, WORLD_H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  for (let y = 0; y < WORLD_H; y += ROAD_SPACING) {
    ctx.fillStyle = "#383e43";
    ctx.fillRect(0, y, WORLD_W, ROAD_WIDTH);

    ctx.strokeStyle = "#b0b0b055";
    ctx.setLineDash([16, 18]);
    ctx.beginPath();
    ctx.moveTo(0, y + ROAD_WIDTH / 2);
    ctx.lineTo(WORLD_W, y + ROAD_WIDTH / 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ====================================
// DRAW BUILDINGS
// ====================================

function drawBuildings() {
  buildings.forEach(b => {
    ctx.fillStyle = "#00000055";
    ctx.fillRect(b.x + 6, b.y + 6, b.w, b.h);

    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);

    ctx.strokeStyle = "#626d7a";
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    for (let wx = b.x + 14; wx < b.x + b.w - 10; wx += 27) {
      for (let wy = b.y + 15; wy < b.y + b.h - 10; wy += 28) {
        ctx.fillStyle =
          ((Math.floor(wx + wy) % 3) === 0)
            ? "#e7b85c"
            : "#43515f";

        ctx.fillRect(wx, wy, 10, 10);
      }
    }
  });
}

// ====================================
// DRAW PLAYER
// ====================================

function drawPlayer() {
  if (player.inCar) return;

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  ctx.fillStyle = "#00000066";
  ctx.beginPath();
  ctx.ellipse(0, 5, 12, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#f5a623";
  ctx.fillRect(-8, -9, 16, 18);

  ctx.fillStyle = "#f1c7a2";
  ctx.beginPath();
  ctx.arc(0, -12, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "bold 11px Arial";
  ctx.textAlign = "center";
  ctx.fillText("YOU", player.x, player.y - 24);
}

// ====================================
// DRAW CARS
// ====================================

function drawCar(car) {
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  // Shadow
  ctx.fillStyle = "#00000077";
  ctx.fillRect(-22, -10, 48, 24);

  // Body
  ctx.fillStyle = car.color;
  ctx.fillRect(-23, -12, 46, 24);

  // Front and rear details
  ctx.fillStyle = "#d7e6f2";
  ctx.fillRect(16, -9, 6, 6);
  ctx.fillRect(16, 3, 6, 6);

  ctx.fillStyle = "#8f2525";
  ctx.fillRect(-22, -9, 4, 6);
  ctx.fillRect(-22, 3, 4, 6);

  // Windows
  ctx.fillStyle = "#9ed8f0";
  ctx.fillRect(-8, -9, 15, 18);

  ctx.fillStyle = "#243342";
  ctx.fillRect(-5, -8, 3, 16);

  // Wheels
  ctx.fillStyle = "#101216";
  ctx.fillRect(-15, -15, 9, 4);
  ctx.fillRect(9, -15, 9, 4);
  ctx.fillRect(-15, 11, 9, 4);
  ctx.fillRect(9, 11, 9, 4);

  ctx.restore();

  if (player.inCar === car) {
    ctx.fillStyle = "#f5a623";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.fillText("YOUR CAR", car.x, car.y - 25);
  }
}

// ====================================
// DRAW GARAGE
// ====================================

function drawGarage() {
  ctx.fillStyle = "#121a24";
  ctx.fillRect(garage.x, garage.y, garage.w, garage.h);

  ctx.strokeStyle = "#f5a623";
  ctx.lineWidth = 3;
  ctx.strokeRect(garage.x, garage.y, garage.w, garage.h);

  ctx.fillStyle = "#f5a623";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "center";
  ctx.fillText("GARAGE", garage.x + garage.w / 2, garage.y + 30);

  ctx.fillStyle = "#d4dbe4";
  ctx.font = "11px Arial";
  ctx.fillText("REFUEL / CARS", garage.x + garage.w / 2, garage.y + 49);
}

// ====================================
// DRAW MISSION MARKER
// ====================================

function drawGoal() {
  if (missionComplete) return;

  const pulse = 1 + Math.sin(Date.now() / 200) * 0.12;

  ctx.strokeStyle = "#f5a623";
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.arc(goal.x, goal.y, goal.size * pulse, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = "#f5a623";
  ctx.font = "bold 14px Arial";
  ctx.textAlign = "center";
  ctx.fillText("MISSION", goal.x, goal.y - 40);
}

// ====================================
// DRAW POLICE
// ====================================

function drawPolice() {
  if (!policeActive) return;

  ctx.save();
  ctx.translate(police.x, police.y);
  ctx.rotate(police.angle);

  ctx.fillStyle = "#d7dce3";
  ctx.fillRect(-22, -12, 44, 24);

  ctx.fillStyle = "#245db4";
  ctx.fillRect(-20, -10, 12, 20);

  ctx.fillStyle = "#d84141";
  ctx.fillRect(8, -10, 12, 20);

  ctx.fillStyle = "#9ee6ff";
  ctx.fillRect(-7, -8, 16, 16);

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "bold 11px Arial";
  ctx.textAlign = "center";
  ctx.fillText("POLICE", police.x, police.y - 23);
}

// ====================================
// CAR ENTRY AND EXIT
// ====================================

function enterOrExitCar() {
  if (gamePaused || gameOver) return;

  if (player.inCar) {
    const car = player.inCar;

    if (Math.abs(car.speed) > 0.5) {
      showMessage(
        "SLOW DOWN",
        "Bring the car to a stop before exiting."
      );
      return;
    }

    const exitX = car.x + Math.cos(car.angle + Math.PI / 2) * 38;
    const exitY = car.y + Math.sin(car.angle + Math.PI / 2) * 38;

    if (
      exitX < 20 || exitY < 20 ||
      exitX > WORLD_W - 20 || exitY > WORLD_H - 20 ||
      collidesBuilding(exitX, exitY, player.size)
    ) {
      showMessage(
        "NO EXIT SPACE",
        "Move the car to a clear area before exiting."
      );
      return;
    }

    player.x = exitX;
    player.y = exitY;
    player.angle = car.angle;
    player.inCar = null;

    $("enterBtn").textContent = "ENTER CAR";
    $("mode").textContent = "ON FOOT";
    $("status");

    return;
  }

  let nearest = null;
  let bestDistance = 65;

  cars.forEach(car => {
    if (!car.parked) return;

    const d = Math.hypot(player.x - car.x, player.y - car.y);

    if (d < bestDistance) {
      nearest = car;
      bestDistance = d;
    }
  });

  if (!nearest) {
    showMessage(
      "NO CAR NEARBY",
      "Walk close to a parked car, then tap ENTER CAR."
    );
    return;
  }

  if (nearest.fuel <= 0) {
    showMessage(
      "EMPTY TANK",
      "This car needs fuel. Visit the garage."
    );
    return;
  }

  player.inCar = nearest;
  player.x = nearest.x;
  player.y = nearest.y;

  $("enterBtn").textContent = "EXIT CAR";
  $("mode").textContent = "DRIVING";
}

// ====================================
// GARAGE SYSTEM
// ====================================

function showMessage(title, text, buttons = []) {
  gamePaused = true;

  $("messageTitle").textContent = title;
  $("messageText").textContent = text;

  const holder = $("messageButtons");
  holder.innerHTML = "";

  buttons.forEach(item => {
    const button = document.createElement("button");
    button.textContent = item.label;
    button.style.margin = "5px";
    button.style.padding = "10px";
    button.style.fontSize = "12px";
    button.style.background = "#f5a623";
    button.style.color = "#111";
    button.style.borderRadius = "8px";

    button.addEventListener("click", item.action);
    holder.appendChild(button);
  });

  const close = document.createElement("button");
  close.textContent = "CLOSE";
  close.style.margin = "5px";
  close.style.padding = "10px";
  close.style.fontSize = "12px";
  close.style.background = "#303b49";
  close.style.borderRadius = "8px";

  close.addEventListener("click", closeMessage);
  holder.appendChild(close);

  $("message").style.display = "block";
}

function closeMessage() {
  $("message").style.display = "none";
  gamePaused = false;
}

function openGarage() {
  if (gamePaused || gameOver) return;

  const x = player.inCar ? player.inCar.x : player.x;
  const y = player.inCar ? player.inCar.y : player.y;

  if (!isInsideGarage(x, y)) {
    showMessage(
      "GARAGE",
      "Visit the orange garage building to refuel or change cars."
    );
    return;
  }

  const options = [];

  options.push({
    label: "REFUEL - $100",
    action: () => {
      if (cash < 100) {
        showMessage("NOT ENOUGH CASH", "You need $100 to refuel.");
        return;
      }

      cash -= 100;

      if (player.inCar) {
        player.inCar.fuel = player.inCar.fuelMax;
      } else {
        cars.forEach(car => {
          if (car.parked) car.fuel = car.fuelMax;
        });
      }

      updateHUD();
      closeMessage();
    }
  });

  cars.forEach(car => {
    options.push({
      label: car.name + (car.owned ? " - SELECT" : " - $" + car.price),
      action: () => {
        if (!car.owned) {
          if (cash < car.price) {
            showMessage(
              "NOT ENOUGH CASH",
              "You need $" + car.price + " to buy this car."
            );
            return;
          }

          cash -= car.price;
          car.owned = true;
        }

        if (player.inCar && player.inCar !== car) {
          player.inCar.speed = 0;
        }

        if (player.inCar) {
          player.inCar = null;
          $("enterBtn").textContent = "ENTER CAR";
        }

        car.parked = true;
        car.fuel = Math.max(car.fuel, 25);

        player.x = car.x + 45;
        player.y = car.y;

        if (collidesBuilding(player.x, player.y, player.size)) {
          player.x = 280;
          player.y = 280;
        }

        updateHUD();
        closeMessage();
      }
    });
  });

  showMessage(
    "CITY GARAGE",
    "Refuel your car or select a vehicle. Purchased cars become available in the city.",
    options
  );
}

// ====================================
// DRIVING SYSTEM
// ====================================

function updateDriving() {
  const car = player.inCar;

  if (!car) return;

  if (car.fuel <= 0) {
    car.fuel = 0;
    car.speed = 0;
  } else {
    if (keys["arrowup"] || keys["w"]) {
      car.speed += car.acceleration;
    } else if (keys["arrowdown"] || keys["s"]) {
      car.speed -= car.acceleration * 1.3;
    } else {
      car.speed *= 0.985;
    }

    car.speed = Math.max(
      -car.maxSpeed * 0.45,
      Math.min(car.maxSpeed, car.speed)
    );

    if (Math.abs(car.speed) > 0.1) {
      const steering = 0.045 * Math.min(1, Math.abs(car.speed) / 2);
      const direction = car.speed >= 0 ? 1 : -1;

      if (keys["arrowleft"] || keys["a"]) {
        car.angle -= steering * direction;
      }

      if (keys["arrowright"] || keys["d"]) {
        car.angle += steering * direction;
      }

      const nx = car.x + Math.cos(car.angle) * car.speed;
      const ny = car.y + Math.sin(car.angle) * car.speed;

      if (
        nx > 25 && nx < WORLD_W - 25 &&
        ny > 25 && ny < WORLD_H - 25 &&
        !collidesBuilding(nx, ny, 36)
      ) {
        car.x = nx;
        car.y = ny;
      } else {
        car.speed *= -0.2;
      }

      car.fuel -= Math.abs(car.speed) * 0.0009;
      car.fuel = Math.max(0, car.fuel);
    }
  }

  player.x = car.x;
  player.y = car.y;
  player.angle = car.angle;
}

// ====================================
// WALKING SYSTEM
// ====================================

function updateWalking() {
  if (player.inCar) return;

  let dx = 0;
  let dy = 0;

  if (keys["arrowup"] || keys["w"]) dy -= player.speed;
  if (keys["arrowdown"] || keys["s"]) dy += player.speed;
  if (keys["arrowleft"] || keys["a"]) dx -= player.speed;
  if (keys["arrowright"] || keys["d"]) dx += player.speed;

  if (dx && dy) {
    dx *= 0.707;
    dy *= 0.707;
  }

  if (dx || dy) {
    player.angle = Math.atan2(dy, dx);
  }

  const nx = Math.max(
    player.size,
    Math.min(WORLD_W - player.size, player.x + dx)
  );

  const ny = Math.max(
    player.size,
    Math.min(WORLD_H - player.size, player.y + dy)
  );

  if (!collidesBuilding(nx, player.y, player.size)) {
    player.x = nx;
  }

  if (!collidesBuilding(player.x, ny, player.size)) {
    player.y = ny;
  }
}

// ====================================
// POLICE AI
// ====================================

function updatePolice() {
  if (!policeActive) return;

  const targetX = player.inCar ? player.inCar.x : player.x;
  const targetY = player.inCar ? player.inCar.y : player.y;

  const dx = targetX - police.x;
  const dy = targetY - police.y;
  const distance = Math.hypot(dx, dy);

  if (distance > 1) {
    police.angle = Math.atan2(dy, dx);

    police.x += Math.cos(police.angle) * police.speed;
    police.y += Math.sin(police.angle) * police.speed;
  }

  if (distance < 28) {
    gameOver = true;

    showMessage(
      "ARRESTED",
      "You have been arrested! Restart to explore the city again.",
      [{
        label: "RESTART",
        action: restartGame
      }]
    );
  }
}

// ====================================
// MISSION SYSTEM
// ====================================

function updateMission() {
  if (missionComplete) return;

  const x = player.inCar ? player.inCar.x : player.x;
  const y = player.inCar ? player.inCar.y : player.y;

  if (Math.hypot(x - goal.x, y - goal.y) < 45) {
    missionComplete = true;
    policeActive = true;

    $("mission").textContent = "MISSION 1 COMPLETE";
    showMessage(
      "MISSION COMPLETE",
      "You explored the city. Your next challenge is to avoid the police encounter."
    );
  }
}

// ====================================
// HUD
// ====================================

function updateHUD() {
  const car = player.inCar;

  $("mode").textContent = car ? "DRIVING" : "ON FOOT";
  $("speed").textContent = car
    ? Math.round(Math.abs(car.speed) * 20)
    : "0";

  $("carName").textContent = car ? car.name : "NONE";

  const fuel = car ? car.fuel : 100;

  $("fuelText").textContent = Math.round(fuel) + "%";
  $("fuelBar").style.width = fuel + "%";

  $("fuelBar").style.background =
    fuel < 20 ? "#e34c4c" :
    fuel < 50 ? "#f5a623" : "#55d879";

  $("cash").textContent = "$" + cash.toLocaleString();

  $("location").textContent = "UNITED STATES";
}

// ====================================
// RESTART GAME
// ====================================

function restartGame() {
  player.x = 280;
  player.y = 280;
  player.angle = 0;
  player.inCar = null;

  cars.forEach(car => {
    car.speed = 0;
    car.fuel = 100;
    car.parked = true;
  });

  police.x = 750;
  police.y = 750;

  policeActive = false;
  missionComplete = false;
  gameOver = false;
  cash = 1000;

  $("mission").textContent = "MISSION 1: Explore the city";
  $("enterBtn").textContent = "ENTER CAR";

  closeMessage();
  updateHUD();
}

// ====================================
// MAIN UPDATE
// ====================================

function update() {
  if (gamePaused || gameOver) return;

  if (player.inCar) {
    updateDriving();
  } else {
    updateWalking();
  }

  updateMission();
  updatePolice();

  const targetX = player.inCar ? player.inCar.x : player.x;
  const targetY = player.inCar ? player.inCar.y : player.y;

  cameraX = Math.max(
    0,
    Math.min(WORLD_W - W, targetX - W / 2)
  );

  cameraY = Math.max(
    0,
    Math.min(WORLD_H - H, targetY - H / 2)
  );

  updateHUD();
}

// ====================================
// DRAW EVERYTHING
// ====================================

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  drawRoads();
  drawBuildings();
  drawGarage();
  drawGoal();

  cars.forEach(car => {
    if (car.parked) drawCar(car);
  });

  drawPolice();
  drawPlayer();

  ctx.restore();
}

// ====================================
// BUTTON EVENTS
// ====================================

$("enterBtn").addEventListener("click", enterOrExitCar);
$("garageBtn").addEventListener("click", openGarage);

$("missionBtn").addEventListener("click", () => {
  if (gamePaused || gameOver) return;

  if (!missionComplete) {
    showMessage(
      "MISSION 1",
      "Explore the city and find the orange mission marker near the roads."
    );
  } else {
    showMessage(
      "MISSION COMPLETE",
      "You have explored the city. Continue driving and visit the garage."
    );
  }
});

// ====================================
// GAME LOOP
// ====================================

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

updateHUD();
loop();

</script>

</body>
